<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Вокально-Инструментальное Искусство — Улуттук тандоо 2026">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Вокально-Инструментальное Искусство</title>
  <link
      rel="icon"
      href="./assets/media/favicon.ico"
      type="image/x-icon"
    />
  <link rel="stylesheet" href="./assets/styles/index.css?v=3">
  <script src="./assets/script.js?v=3" defer></script>
  <script type="module" src="./assets/voting.js?v=3" defer></script>
</head>
<body>

  <!-- HEADER -->
  <header class="header" id="header">
    <div class="container header__container">
      <img src="./assets/media/nomad-games-svg.svg" alt="logo">
      <div class="header__lang">
        <button class="header__lang-btn" data-lang="ru" onclick="setLang('ru')">ru</button>
        <button class="header__lang-btn active" data-lang="ky" onclick="setLang('ky')">ky</button>
        <button class="header__lang-btn" data-lang="en" onclick="setLang('en')">en</button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero__container">
      <div class="bg__animation">
        <div id="stars"></div><div id="stars2"></div><div id="stars3"></div><div id="stars4"></div>
      </div>
      
      <div class="container">
        <img class="hero__logo" id="heroLogo" src="./assets/media/kg-02.webp" alt="logo">
        <div class="hero__subtitle center" data-i18n="subtitle"></div>
        <div class="divider"></div>
        <div class="hero__info-row">
          <div class="hero__info-item">
            <div class="label" data-i18n="date_label"></div>
            <div class="value" data-i18n="date_text"></div>
          </div>
          <div class="hero__info-item info-item--right">
            <div class="label" data-i18n="place_label"></div>
            <div class="value" data-i18n="place_text"></div>
          </div>
        </div>
        <div class="hero__cta-wrap">
          <a href="#members" class="hero__cta-btn" data-i18n="cta_btn"></a>
        </div>
        <div class="hero__countdown">
          <div class="hero__cd-cell"><div class="num" id="cd-days">00</div><div class="unit" data-i18n="cd_day"></div></div>
          <div class="hero__cd-cell"><div class="num" id="cd-hours">00</div><div class="unit" data-i18n="cd_hour"></div></div>
          <div class="hero__cd-cell"><div class="num" id="cd-mins">00</div><div class="unit" data-i18n="cd_min"></div></div>
          <div class="hero__cd-cell"><div class="num" id="cd-secs">00</div><div class="unit" data-i18n="cd_sec"></div></div>
        </div>
      </div>

      <div class='air air1'></div><div class='air air2'></div><div class='air air3'></div><div class='air air4'></div>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="about">
    <div class="container about__container">
      <h2 class="title" data-i18n="about_title"></h2>
      <p data-i18n="about_text"></p>
    </div>
  </section>

  <!-- NATION -->
  <section class="nation" id="nation">
    <div class="container">
      <h2 class="title" data-i18n="nation_title"></h2>
      <p class="center" data-i18n="nation_sub"></p>
      <div class="nation__box">
        <div class="nation__box-items first">
          <svg width="60" height="60" viewBox="0 0 64 64" fill="none"><rect x="12" y="8" width="40" height="48" rx="6" stroke="#f0c040" stroke-width="3"/><path d="M22 20h20M22 28h20M22 36h12" stroke="#f0c040" stroke-width="3" stroke-linecap="round"/><circle cx="44" cy="48" r="8" fill="#1a3a8f" stroke="#f0c040" stroke-width="2"/><path d="M41 48l2 2 4-4" stroke="#f0c040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h4 data-i18n="stage1_title"></h4>
          <p data-i18n="stage1_desc"></p>
        </div>
        <div class="nation__box-items">
          <svg width="60" height="60" viewBox="0 0 64 64" fill="none"><rect x="6" y="16" width="36" height="28" rx="5" stroke="#f0c040" stroke-width="3"/><path d="M42 24l14-8v28l-14-8V24z" stroke="#f0c040" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="30" r="6" stroke="#f0c040" stroke-width="2"/><path d="M22 30l5-3v6l-5-3z" fill="#f0c040"/></svg>
          <h4 data-i18n="stage2_title"></h4>
          <p data-i18n="stage2_desc"></p>
        </div>
        <div class="nation__box-items third">
          <svg width="60" height="60" viewBox="0 0 64 64" fill="none"><path d="M20 8h24v20a12 12 0 01-24 0V8z" stroke="#f0c040" stroke-width="3" stroke-linejoin="round"/><path d="M20 16H10a6 6 0 006 6h4M44 16h10a6 6 0 01-6 6h-4" stroke="#f0c040" stroke-width="3" stroke-linecap="round"/><path d="M32 40v10M22 50h20" stroke="#f0c040" stroke-width="3" stroke-linecap="round"/></svg>
          <h4 data-i18n="stage3_title"></h4>
          <p data-i18n="stage3_desc"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- MEMBERS -->
  <section class="members" id="members">
    <div class="container members__container">
      <div class="bg-animation">
        <div id="stars"></div><div id="stars2"></div><div id="stars3"></div><div id="stars4"></div>
      </div>
      <h2 class="title members__title" data-i18n="members_title"></h2>
      <p class="center" data-i18n="vote_time"></p>
      <div class="members__list" id="membersList">
        <div class="members__loading">Загрузка...</div>
      </div>
    </div>
  </section>
  <!-- JURY SCORES -->
  <section class="jury-scores">
    <div class="container members__container">
      <h2 class="title members__title" data-i18n="jury_title"></h2>
      <div id="juryScoresList"></div>
    </div>
  </section>

  <!-- VOTING MODAL -->
  <div id="voteModal" class="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">✕</button>

      <!-- Шаг 1: Вход -->
      <div id="modal-login" class="modal-step active">
        <div class="modal-icon">🎵</div>
        <h3 class="modal-title" data-i18n="modal_title"></h3>
        <p class="modal-desc"><span data-i18n="modal_for"></span> <strong id="candidateName"></strong></p>
        <p class="modal-desc" style="margin-top:6px;" data-i18n="modal_hint"></p>
        <button class="modal-btn modal-btn--google" id="googleBtn" onclick="signInWithGoogle()">
          <svg width="20" height="20" viewBox="0 0 48 48" style="margin-right:10px;flex-shrink:0;">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span data-i18n="google_btn"></span>
        </button>
        <div class="modal-error" id="loginError"></div>
      </div>

      <!-- Шаг 2: Успех -->
      <div id="modal-success" class="modal-step">
        <div class="modal-icon">🎉</div>
        <h3 class="modal-title" style="color:#51cf66;" data-i18n="success_title"></h3>
        <p class="modal-desc" data-i18n="success_for"></p>
        <div class="success-name" id="successName"></div>
        <p class="modal-desc" style="color:#666;font-size:12px;margin-top:12px;" data-i18n="success_note"></p>
        <button class="modal-btn" onclick="closeModal()" data-i18n="close_btn"></button>
      </div>

      <!-- Шаг 3: Уже голосовал -->
      <div id="modal-already" class="modal-step">
        <div class="modal-icon">✅</div>
        <h3 class="modal-title" style="color:#f0c040;" data-i18n="already_title"></h3>
        <p class="modal-desc" data-i18n="already_for"></p>
        <div class="success-name" id="alreadyName"></div>
        <p class="modal-desc" style="color:#666;font-size:12px;margin-top:12px;" data-i18n="already_note"></p>
        <button class="modal-btn" onclick="closeModal()" data-i18n="close_btn"></button>
      </div>

    </div>
  </div>

</body>

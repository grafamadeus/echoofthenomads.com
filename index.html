<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Echo of Nomads — Улуттук тандоо</title>
  <link rel="stylesheet" href="./main.css">
  <script src="./main.js" defer></script>
</head>
<body>
  <!-- HEADER -->
  <header class="header" id="header">
    <div class="container header__container">
      <img src="./echo-nomad/assets/media/nomad-games-svg.svg" alt="logo">
      <div class="header__lang">
        <button class="header__lang-btn" data-lang="ru" onclick="setLang('ru')">ru</button>
        <button class="header__lang-btn active" data-lang="ky" onclick="setLang('ky')">ky</button>
        <button class="header__lang-btn" data-lang="en" onclick="setLang('en')">en</button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="bg__animation">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </div>

    <div class="hero__content">
      <div class="hero__tag" data-i18n="tag">Дүйнөлүк көчмөндөр оюндары 2026</div>
      <h1 class="hero__title">
        <span data-i18n="title_line1">Улуттук</span>
        <span data-i18n="title_line2">тандоо</span>
      </h1>
      <p class="hero__subtitle-text" data-i18n="subtitle">Echo of Nomads</p>
      <div class="hero__divider"></div>
      <div class="hero__info">
        <div class="hero__info-item">
          <div class="hero__info-label" data-i18n="date_label"></div>
          <div class="hero__info-value" data-i18n="date_text"></div>
        </div>
        <div class="hero__info-item">
          <div class="hero__info-label" data-i18n="place_label"></div>
          <div class="hero__info-value" data-i18n="place_text"></div>
        </div>
      </div>
    </div>

    <div class="air air1"></div>
    <div class="air air2"></div>
    <div class="air air3"></div>
    <div class="air air4"></div>
  </section>

  <!-- CONTESTS -->
  <section class="contests">
    <div class="contests__inner">
      <p class="contests__label" data-i18n="contests_label">Конкурстар</p>
      <h2 class="contests__title" data-i18n="contests_title">Конкурсту тандаңыз</h2>

      <div class="contests__grid" id="contestsGrid"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__inner">
      <a href="https://worldnomadgames.org" class="footer__site" target="_blank">worldnomadgames.org</a>
    </div>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Echo of Nomads — Улуттук тандоо</title>
  <style>
    :root {
      --navy-dark: #0a0f2c;
      --navy: #1a3a8f;
      --gold: #f5c400;
      --gold-light: #f7d340;
      --gold-dark: #f0c040;
      --white: #ffffff;
      --text-muted: #888;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { text-decoration: none; color: inherit; }
    button { background: none; border: none; cursor: pointer; font-family: inherit; }

    html, body {
      min-height: 100%;
      background: var(--navy-dark);
      color: var(--white);
      font-family: 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
    }
    .header__inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 56px;
      background: rgba(240,240,240,0.97);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header__logo {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .header__lang {
      display: flex;
      gap: 4px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .header__lang-btn {
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      padding: 4px 10px;
      border-radius: 5px;
      transition: .2s;
    }
    .header__lang-btn.active {
      background: var(--navy);
      color: var(--white);
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: url('./echo-nomad/assets/media/background-01-01 (1).png') no-repeat center/cover;
      padding: 80px 24px 160px;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(245,196,0,0.08) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Stars */
    .bg__animation {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    #stars  { width:1px;  height:1px;  background:transparent; box-shadow:117px 1613px #FFF,1488px 635px #FFF,944px 914px #FFF,647px 277px #FFF,1792px 1205px #FFF,656px 1517px #FFF,820px 1839px #FFF,1153px 1400px #FFF,870px 13px #FFF,550px 702px #FFF,1155px 1056px #FFF,88px 1709px #FFF,1450px 1090px #FFF,1929px 457px #FFF,1390px 905px #FFF,1771px 269px #FFF,1741px 669px #FFF,432px 64px #FFF,563px 996px #FFF,1918px 1873px #FFF; animation: animStar 50s linear infinite; }
    #stars:after  { content:" "; position:absolute; top:2000px; width:1px;  height:1px;  background:transparent; box-shadow:117px 1613px #FFF,1488px 635px #FFF,944px 914px #FFF,647px 277px #FFF,1792px 1205px #FFF,656px 1517px #FFF,820px 1839px #FFF,1153px 1400px #FFF,870px 13px #FFF,550px 702px #FFF,1155px 1056px #FFF,88px 1709px #FFF,1450px 1090px #FFF,1929px 457px #FFF,1390px 905px #FFF,1771px 269px #FFF,1741px 669px #FFF,432px 64px #FFF,563px 996px #FFF,1918px 1873px #FFF; }
    #stars2 { width:2px;  height:2px;  background:transparent; box-shadow:1117px 1306px #FFF,1078px 1783px #FFF,1179px 1085px #FFF,1145px 920px #FFF,422px 1233px #FFF,387px 98px #FFF,1153px 637px #FFF,1084px 782px #FFF,476px 453px #FFF,926px 1306px #FFF,60px 1086px #FFF,753px 1575px #FFF,272px 1684px #FFF,1285px 750px #FFF,1416px 1327px #FFF,1931px 473px #FFF,736px 1395px #FFF,1816px 763px #FFF,438px 879px #FFF,665px 1902px #FFF; animation: animStar 100s linear infinite; }
    #stars2:after { content:" "; position:absolute; top:2000px; width:2px;  height:2px;  background:transparent; box-shadow:1117px 1306px #FFF,1078px 1783px #FFF,1179px 1085px #FFF,1145px 920px #FFF,422px 1233px #FFF,387px 98px #FFF,1153px 637px #FFF,1084px 782px #FFF,476px 453px #FFF,926px 1306px #FFF,60px 1086px #FFF,753px 1575px #FFF,272px 1684px #FFF,1285px 750px #FFF,1416px 1327px #FFF,1931px 473px #FFF,736px 1395px #FFF,1816px 763px #FFF,438px 879px #FFF,665px 1902px #FFF; }
    #stars3 { width:3px;  height:3px;  background:transparent; box-shadow:940px 1360px #FFF,1071px 539px #FFF,1710px 1414px #FFF,836px 299px #FFF,1944px 1420px #FFF,253px 1449px #FFF,1257px 1250px #FFF,1588px 1830px #FFF,1077px 1204px #FFF,273px 1081px #FFF; animation: animStar 150s linear infinite; }
    #stars3:after { content:" "; position:absolute; top:2000px; width:3px;  height:3px;  background:transparent; box-shadow:940px 1360px #FFF,1071px 539px #FFF,1710px 1414px #FFF,836px 299px #FFF,1944px 1420px #FFF,253px 1449px #FFF,1257px 1250px #FFF,1588px 1830px #FFF,1077px 1204px #FFF,273px 1081px #FFF; }
    @keyframes animStar {
      from { transform: translateY(0px); }
      to   { transform: translateY(-2000px); }
    }

    /* Hero content */
    .hero__content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 800px;
      width: 100%;
    }
    .hero__tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid rgba(245,196,0,0.4);
      border-radius: 20px;
      padding: 5px 16px;
      margin-bottom: 24px;
    }
    .hero__title {
      font-size: clamp(36px, 8vw, 80px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -2px;
      text-transform: uppercase;
      color: var(--white);
      text-shadow: 0 0 60px rgba(245,196,0,0.2);
      margin-bottom: 8px;
    }
    .hero__title span {
      color: var(--gold);
      display: block;
    }
    .hero__subtitle-text {
      font-size: clamp(11px, 2vw, 13px);
      font-weight: 500;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 32px;
    }
    .hero__divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(245,196,0,0.5), transparent);
      margin: 0 auto 32px;
    }
    .hero__info {
      display: flex;
      gap: 40px;
      justify-content: center;
      margin-bottom: 0;
    }
    .hero__info-item { text-align: center; }
    .hero__info-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .hero__info-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--white);
      text-transform: uppercase;
    }

    /* Waves */
    .air {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 100px;
      background: url(https://1.bp.blogspot.com/-xQUc-TovqDk/XdxogmMqIRI/AAAAAAAACvI/AizpnE509UMGBcTiLJ58BC6iViPYGYQfQCLcBGAsYHQ/s1600/wave.png);
      background-size: 1000px 100px;
    }
    .air.air1 { animation: wave 30s linear infinite; z-index:10; opacity:1; }
    .air.air2 { animation: wave2 15s linear infinite; z-index:9; opacity:0.5; animation-delay:-5s; bottom:10px; }
    .air.air3 { animation: wave 30s linear infinite; z-index:8; opacity:0.2; animation-delay:-2s; bottom:15px; }
    .air.air4 { animation: wave2 5s linear infinite; z-index:7; opacity:0.7; animation-delay:-5s; bottom:20px; }
    @keyframes wave  { 0% { background-position-x: 0px; } 100% { background-position-x: 1000px; } }
    @keyframes wave2 { 0% { background-position-x: 0px; } 100% { background-position-x: -1000px; } }

    /* ── CONTESTS SECTION ── */
    .contests {
      background: var(--navy-dark);
      padding: 80px 24px 80px;
    }
    .contests__inner {
      max-width: 800px;
      margin: 0 auto;
    }
    .contests__label {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }
    .contests__title {
      text-align: center;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 800;
      text-transform: uppercase;
      color: var(--white);
      letter-spacing: 1px;
      margin-bottom: 48px;
    }
    .contests__grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .contest-card {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(240,192,64,0.15);
      border-radius: 16px;
      padding: 20px 24px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      color: var(--white);
      position: relative;
      overflow: hidden;
    }
    .contest-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(245,196,0,0.04), transparent);
      transition: left 0.5s ease;
    }
    .contest-card:hover::before { left: 140%; }
    .contest-card:hover {
      border-color: rgba(240,192,64,0.5);
      background: rgba(255,255,255,0.06);
      transform: translateX(4px);
    }
    .contest-card__num {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(240,192,64,0.1);
      border: 1px solid rgba(240,192,64,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--gold);
      flex-shrink: 0;
    }
    .contest-card__info { flex: 1; }
    .contest-card__name {
      font-size: 16px;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 3px;
    }
    .contest-card__sub {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 1px;
    }
    .contest-card__arrow {
      color: rgba(240,192,64,0.5);
      font-size: 18px;
      transition: transform 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .contest-card:hover .contest-card__arrow {
      transform: translateX(4px);
      color: var(--gold);
    }

    /* ── FOOTER ── */
    .footer {
      background: #f0f0f0;
      padding: 16px 24px;
    }
    .footer__inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .footer__site {
      font-size: 12px;
      font-weight: 600;
      color: var(--navy);
      letter-spacing: 1px;
      text-decoration: underline;
    }
    .footer__socials { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .footer__icon {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, opacity 0.2s;
    }
    .footer__icon svg { width: 16px; height: 16px; }
    .footer__icon:hover { transform: translateY(-2px); opacity: 0.85; }

    /* ── RESPONSIVE ── */
    @media (min-width: 600px) {
      .contests__grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (min-width: 900px) {
      .contests__grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .contest-card:hover {
        transform: translateY(-4px) translateX(0);
      }
    }
  </style>
</head>

    let currentLang = 'ky';

    function renderContests() {
      const grid = document.getElementById('contestsGrid');
      const t = i18n[currentLang];
      grid.innerHTML = '';
      contests.forEach((c, i) => {
        const a = document.createElement('a');
        a.href = c.url;
        a.className = 'contest-card';
        a.innerHTML = `
          <div class="contest-card__num">${c.emoji}</div>
          <div class="contest-card__info">
            <div class="contest-card__name">${c[currentLang]}</div>
            <div class="contest-card__sub">${t.national_sub}</div>
          </div>
          <div class="contest-card__arrow">→</div>
        `;
        grid.appendChild(a);
      });
    }

    window.setLang = (lang) => {
      currentLang = lang;
      const t = i18n[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key] !== undefined) el.textContent = t[key];
      });
      document.querySelectorAll('.header__lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });
      renderContests();
    };

    // Инициализация
    setLang('ky');

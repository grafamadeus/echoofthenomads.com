<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Түз эфир — Калыстар тобунун баллдары</title>
  <link rel="icon" href="./assets/media/favicon.ico" type="image/x-icon">
  <style>
    :root{
      --navy-dark:#0a0f2c; --gold:#f0c040; --gold-soft:rgba(240,192,64,.4);
      --azure:#4db8ff; --white:#fff; --muted:#93a0c8;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{background:var(--navy-dark);color:var(--white);
      font-family:'Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column}

    .bg{position:fixed;inset:0;z-index:0;
      background:url('./assets/media/background-01-01 (1).webp') no-repeat center/cover}
    .bg::before{content:'';position:absolute;inset:0;background:rgba(10,15,44,.78)}

    .head{flex:0 0 auto;z-index:2;display:flex;align-items:center;justify-content:center;gap:12px;
      padding:clamp(10px,1.6vh,18px) 24px}
    .dot{width:10px;height:10px;border-radius:50%;background:#ff4444;animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
    .head h1{font-size:clamp(13px,1.7vw,19px);font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold)}

    .content{flex:1 1 auto;min-height:0;z-index:2;display:grid;
      grid-template-columns:minmax(240px,1fr) 2.6fr;gap:clamp(14px,2vw,30px);
      padding:0 clamp(16px,2.5vw,44px) clamp(16px,2.4vh,34px)}

    .featured{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:clamp(6px,1.4vh,14px);text-align:center;
      background:linear-gradient(160deg,rgba(22,33,62,.92),rgba(15,52,96,.92));
      border:1px solid var(--gold-soft);border-radius:22px;padding:clamp(16px,3vh,34px) 18px;
      box-shadow:0 0 44px rgba(240,192,64,.16)}
    .featured .pill{display:inline-block;background:rgba(240,192,64,.15);border:1px solid var(--gold-soft);
      border-radius:999px;padding:4px 16px;font-size:clamp(9px,.9vw,12px);font-weight:700;
      letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
    .featured img.ph{width:clamp(120px,20vh,224px);aspect-ratio:1;border-radius:50%;object-fit:cover;
      border:3px solid var(--gold);box-shadow:0 0 34px rgba(240,192,64,.4)}
    .featured .nm{font-size:clamp(15px,1.8vw,25px);font-weight:800;text-transform:uppercase;letter-spacing:.5px;line-height:1.15}
    .featured .cn{font-size:clamp(11px,1vw,14px);color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center}
    .featured .cn img{width:24px;height:16px;border-radius:2px;object-fit:cover}
    .featured .sc{font-size:clamp(40px,7.5vh,76px);font-weight:900;color:var(--gold);line-height:1;text-shadow:0 0 30px rgba(240,192,64,.5)}
    .featured .scl{font-size:clamp(9px,.85vw,12px);letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
    .empty{color:var(--muted);font-size:clamp(12px,1.2vw,16px)}

    .list{min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;
      gap:clamp(5px,.9vh,11px) clamp(10px,1.5vw,22px)}
    .row{display:flex;align-items:center;gap:clamp(8px,1vw,14px);min-height:0;
      background:rgba(255,255,255,.05);border:1px solid rgba(240,192,64,.12);border-radius:12px;
      padding:0 clamp(10px,1.2vw,16px)}
    .row.lead{border-color:rgba(240,192,64,.6);background:rgba(240,192,64,.1)}
    .row.audience{border-color:rgba(77,184,255,.4)}
    .row .n{font-size:clamp(11px,1vw,15px);font-weight:700;color:#5b6690;width:clamp(16px,1.7vw,26px);text-align:center;flex-shrink:0}
    .row.lead .n{color:var(--gold)}
    .row img.ph{width:clamp(30px,4.8vh,54px);aspect-ratio:1;border-radius:50%;object-fit:cover;
      border:2px solid rgba(240,192,64,.3);flex-shrink:0}
    .row.audience img.ph{border-color:rgba(77,184,255,.6)}
    .row .nm{flex:1;min-width:0;font-size:clamp(12px,1.4vw,21px);font-weight:600;color:#cdd4ee;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row.lead .nm{color:#fff}
    .row .tag{font-size:clamp(8px,.85vw,11px);font-weight:700;letter-spacing:.5px;text-transform:uppercase;
      color:var(--azure);flex-shrink:0;white-space:nowrap}
    .row .sc{font-size:clamp(16px,2.1vh,27px);font-weight:900;color:rgba(240,192,64,.5);flex-shrink:0;
      min-width:clamp(24px,2.6vw,42px);text-align:right}
    .row.lead .sc{color:var(--gold)}
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="head">
    <span class="dot"></span>
    <h1>Түз эфир — Калыстар тобунун баллдары</h1>
  </div>

  <div class="content">
    <div class="featured" id="featured"><div class="empty">Калыстар тобу баа берүүнү күтүүдө…</div></div>
    <div class="list" id="list"></div>
  </div>

  <script>
  const API = "https://api.echoofthenomads.com";
  const PHOTO = {
    "elif":"./assets/media/members/elif.webp","batista":"./assets/media/members/batista.webp",
    "villegas":"./assets/media/members/villegas.webp","roger-ricco":"./assets/media/members/Roger Ricco.webp",
    "angelov-vasil":"./assets/media/members/Angelov Vasil.webp","lva":"./assets/media/members/lva.webp",
    "vika":"./assets/media/members/vika.webp","hodaya":"./assets/media/members/hodaya.webp",
    "buga":"./assets/media/members/buga.webp","naumenko":"./assets/media/members/naumenko.webp",
    "hasanic":"./assets/media/members/hasanic.webp","leal":"./assets/media/members/leal.webp",
    "thami":"./assets/media/members/thami.webp","odmandakh":"./assets/media/members/odmandakh.jpeg",
    "ngo-chau":"./assets/media/members/ngo chau.webp","zhasmin":"./assets/media/members/zhasmin.webp",
    "danial":"./assets/media/members/danial.webp","lee":"./assets/media/members/lee.webp",
    "derkembaev":"./assets/media/members/derkembaev.webp","starbekov":"./assets/media/members/starbekov.webp"
  };
  const NO_PHOTO = "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 56%22%3E%3Crect width=%2256%22 height=%2256%22 fill=%22%231a2540%22/%3E%3Ccircle cx=%2228%22 cy=%2223%22 r=%2210%22 fill=%22%23f0c040%22/%3E%3Cpath d=%22M9 52c1-11 9-17 19-17s18 6 19 17z%22 fill=%22%23f0c040%22/%3E%3C/svg%3E";
  const img = s => PHOTO[s] || NO_PHOTO;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let meta = {}; // id -> {name, slug, country, code, votes}

  async function tick(){
    try{
      const [pr, jr] = await Promise.all([
        fetch(API + '/api/results', { cache:'no-store' }).then(r => r.json()),
        fetch(API + '/api/jury/results', { cache:'no-store' }).then(r => r.json()),
      ]);
      (pr.participants || []).forEach(p => meta[p.id] = p);

      if (jr.hidden) { renderHidden(); return; }

      // current audience-vote leader — always barred from also being the jury leader
      let audId = null, maxV = 0;
      (pr.participants || []).forEach(p => { if ((p.votes||0) > maxV) { maxV = p.votes; audId = p.id; } });
      if (maxV === 0) audId = null;

      const e = (jr.totals && jr.totals.ethno) || {};
      const w = (jr.totals && jr.totals.world) || {};
      const rows = Object.keys(meta).map(id => {
        id = +id;
        const s = ((e[id] && e[id].total) || 0) + ((w[id] && w[id].total) || 0);
        return { id, name: meta[id].name, slug: meta[id].slug, country: meta[id].country, code: meta[id].code, score: s };
      }).sort((a,b) => (b.score - a.score) || (a.id - b.id));

      // featured jury winner = top score that is NOT the audience leader
      const leader = rows.find(r => r.score > 0 && r.id !== audId) || null;
      render(rows, leader, audId);
    }catch(e){}
  }

  function renderHidden(){
    document.getElementById('featured').innerHTML =
      '<span class="pill">Жыйынтык</span>' +
      '<div class="nm" style="font-size:clamp(18px,2.4vw,34px)">Калыстар тобунун баллдары<br>жабык</div>' +
      '<div class="scl">жыйынтык жарыяланганга чейин</div>';
    document.getElementById('list').innerHTML = '';
  }

  function render(rows, leader, audId){
    const f = document.getElementById('featured');
    if (!leader){
      f.innerHTML = '<div class="empty">Калыстар тобу баа берүүнү күтүүдө…</div>';
    } else {
      f.innerHTML =
        '<span class="pill">🏆 Калыстар тобунун лидери</span>' +
        '<img class="ph" src="'+img(leader.slug)+'" onerror="this.onerror=null;this.src=\''+NO_PHOTO+'\'" alt="">' +
        '<div class="nm">'+esc(leader.name)+'</div>' +
        '<div class="cn"><img src="./assets/media/flags/'+leader.code+'.svg" alt="">'+esc(leader.country||'')+'</div>' +
        '<div class="sc">'+leader.score+'</div><div class="scl">жалпы балл</div>';
    }
    const list = document.getElementById('list');
    list.innerHTML = rows.map((p,i) => {
      const isLead = leader && p.id === leader.id;
      const isAud  = audId && p.id === audId;
      return '<div class="row'+(isLead?' lead':'')+(isAud?' audience':'')+'">' +
        '<span class="n">'+(i+1)+'</span>' +
        '<img class="ph" src="'+img(p.slug)+'" onerror="this.onerror=null;this.src=\''+NO_PHOTO+'\'" alt="">' +
        '<span class="nm">'+esc(p.name)+'</span>' +
        (isAud ? '<span class="tag">🎫 приз зрителей</span>' : '') +
        '<span class="sc">'+(p.score || '—')+'</span>' +
      '</div>';
    }).join('');
  }
  tick();
  setInterval(tick, 3000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Jury — Echo of Nomads 2026</title>
  <link rel="icon" href="./assets/media/favicon.ico" type="image/x-icon">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root{
      --navy-dark:#0a0f2c; --panel:#141b3d; --gold:#f0c040; --gold-dark:#c9a227;
      --white:#fff; --muted:#93a0c8; --line:rgba(240,192,64,.18);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
    html,body{min-height:100%;background:var(--navy-dark);color:var(--white);
      font-family:'Inter',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}

    /* ── centered screens ── */
    .screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
    .box{max-width:360px;width:100%}
    .box .icon{font-size:2.6rem;margin-bottom:12px}
    .box h2{font-size:1.15rem;font-weight:700;margin-bottom:6px}
    .box p{font-size:.85rem;color:var(--muted);margin-bottom:22px;line-height:1.5}
    .gsi-wrap{display:flex;justify-content:center;min-height:44px}
    .err{color:#ff6b6b;font-size:.8rem;margin-top:10px;min-height:18px}
    .linkbtn{margin-top:18px;font-size:.8rem;color:var(--gold);text-decoration:underline}

    /* ── main ── */
    #mainScreen{display:none}
    .topbar{position:sticky;top:0;z-index:5;background:rgba(10,15,44,.92);backdrop-filter:blur(6px);
      border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;
      justify-content:space-between;gap:12px;flex-wrap:wrap}
    .topbar .who{font-size:.75rem;color:var(--muted)}
    .topbar .who b{color:var(--gold);font-weight:600}
    .topbar .out{font-size:.75rem;color:var(--muted);text-decoration:underline}
    .tabs{display:flex;gap:8px}
    .tab{padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;font-weight:600;color:var(--muted)}
    .tab.active{background:var(--gold);color:#000;border-color:var(--gold)}
    .tab.locked{opacity:.45}
    .tab .now{display:inline-block;width:6px;height:6px;border-radius:50%;background:#51cf66;margin-left:6px;vertical-align:middle}
    .tab .lk{margin-left:6px;opacity:.7}

    .wrap{max-width:760px;margin:0 auto;padding:20px 14px 60px}
    .hint{text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:18px}
    .closed{text-align:center;color:#ffb84d;font-size:.85rem;margin-bottom:16px}
    .catnote{text-align:center;color:#ffb84d;font-size:.82rem;margin-bottom:16px}

    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
    .card__top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
    .pnum{flex-shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
      border-radius:50%;background:rgba(240,192,64,.15);border:1px solid rgba(240,192,64,.45);
      color:var(--gold);font-weight:800;font-size:.82rem}
    .card__photo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid rgba(240,192,64,.4);flex-shrink:0;background:#1a2540}
    .card__id{flex:1;min-width:0}
    .card__name{font-size:.95rem;font-weight:700}
    .card__country{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
    .card__country img{width:20px;height:14px;border-radius:2px;object-fit:cover}
    .card__total{text-align:center;min-width:44px}
    .card__total b{display:block;font-size:1.3rem;font-weight:800;color:var(--gold);line-height:1}
    .card__total span{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    .scores{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
    .scores.locked{opacity:.3;pointer-events:none;filter:grayscale(1)}
    .sbtn{padding:16px 0;background:rgba(255,255,255,.05);border:1px solid rgba(240,192,64,.2);
      border-radius:8px;color:var(--muted);font-size:.9rem;font-weight:700;transition:.12s}
    .sbtn:hover{background:rgba(240,192,64,.14);color:var(--gold)}
    .sbtn.on{background:var(--gold);color:#000;border-color:var(--gold)}
    .saved{margin-top:8px;font-size:.72rem;color:#51cf66;min-height:16px;text-align:right}

    @media(min-width:620px){ .scores{gap:6px} .sbtn{padding:20px 0} }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="screen">
    <div class="box">
      <div class="icon">🎵</div>
      <h2>Jury Panel</h2>
      <p>Sign in with the jury Google account</p>
      <div id="gsiButton" class="gsi-wrap"></div>
      <div class="err" id="loginError"></div>
    </div>
  </div>

  <!-- DENIED -->
  <div id="deniedScreen" class="screen" style="display:none">
    <div class="box">
      <div class="icon">🚫</div>
      <h2 style="color:#ff6b6b">Access denied</h2>
      <p>This page is for jury members only. This account is not on the list.</p>
      <button class="linkbtn" onclick="location.reload()">Sign in with another account</button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainScreen">
    <div class="topbar">
      <div class="who">Jury: <b id="jurorName">—</b></div>
      <div class="tabs" id="catTabs"></div>
      <button class="out" onclick="signOut()">Sign out</button>
    </div>
    <div class="wrap">
      <div class="hint">Tap a score 1–10 — it saves instantly. You can change it until scoring closes.</div>
      <div class="closed" id="closedBanner" style="display:none">Scoring closed by the administrator</div>
      <div class="catnote" id="catNote" style="display:none"></div>
      <div id="grid"></div>
    </div>
  </div>

  <script>
  const API = "https://api.echoofthenomads.com";
  const GOOGLE_CLIENT_ID = "946233553017-h64ou08icrjua955hl8esmgpe49959ll.apps.googleusercontent.com";
  const CAT_LABEL = { ethno: "Ethno-Hit", world: "World-Hit" };
  const PHOTO = {
    "elif":"./assets/media/members/elif.webp","batista":"./assets/media/members/batista.webp",
    "villegas":"./assets/media/members/villegas.webp","roger-ricco":"./assets/media/members/Roger Ricco.webp",
    "angelov-vasil":"./assets/media/members/Angelov Vasil.webp","lva":"./assets/media/members/lva.webp",
    "vika":"./assets/media/members/vika.webp","hodaya":"./assets/media/members/hodaya.webp",
    "buga":"./assets/media/members/buga.webp","naumenko":"./assets/media/members/naumenko.webp",
    "hasanic":"./assets/media/members/hasanic.webp","leal":"./assets/media/members/leal.webp",
    "thami":"./assets/media/members/thami.webp","odmandakh":"./assets/media/members/odmandakh.jpeg",
    "ngo-chau":"./assets/media/members/ngo chau.webp","zhasmin":"./assets/media/members/zhasmin.webp",
    "danial":"./assets/media/members/danial.webp","lee":"./assets/media/members/lee.webp",
    "derkembaev":"./assets/media/members/derkembaev.webp","starbekov":"./assets/media/members/starbekov.webp"
  };
  const NO_PHOTO = "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 56%22%3E%3Crect width=%2256%22 height=%2256%22 fill=%22%231a2540%22/%3E%3Ccircle cx=%2228%22 cy=%2223%22 r=%2210%22 fill=%22%23f0c040%22/%3E%3Cpath d=%22M9 52c1-11 9-17 19-17s18 6 19 17z%22 fill=%22%23f0c040%22/%3E%3C/svg%3E";

  let token = null;
  try { token = sessionStorage.getItem('jury_token'); } catch {}
  let participants = [];
  let myScores = { ethno:{}, world:{} };
  let totals = { ethno:{}, world:{} };
  let panel = { open:true, category:'ethno' };
  let viewCat = 'ethno';
  let prevActive = null;   // last known panel.category, to auto-follow admin switches
  let gsiReady = false;

  const H = () => ({ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' });
  const show = (id) => {
    ['loginScreen','deniedScreen'].forEach(s => { const e=document.getElementById(s); if(e) e.style.display='none'; });
    document.getElementById('mainScreen').style.display='none';
    const el = document.getElementById(id);
    if (el) el.style.display = (id === 'mainScreen') ? 'block' : 'flex';
  };
  function logout() {
    token = null;
    try { sessionStorage.removeItem('jury_token'); } catch {}
    show('loginScreen'); renderGsi();
  }
  window.signOut = logout;

  // ── Google ──
  function initGsi() {
    if (!window.google || !google.accounts || !google.accounts.id) return void setTimeout(initGsi, 150);
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential, auto_select:false });
    gsiReady = true;
    if (!token) renderGsi();
  }
  function renderGsi() {
    const el = document.getElementById('gsiButton');
    if (!el) return;
    if (!gsiReady) { el.textContent = '…'; return void setTimeout(renderGsi, 200); }
    el.innerHTML = '';
    google.accounts.id.renderButton(el, { theme:'filled_blue', size:'large', shape:'pill', text:'continue_with', width:260 });
  }
  async function onCredential(resp) {
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try {
      const r = await fetch(API + '/api/jury/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ credential: resp.credential }),
      });
      const d = await r.json().catch(()=>({}));
      if (r.ok && d.ok) {
        token = d.token;
        try { sessionStorage.setItem('jury_token', token); } catch {}
        document.getElementById('jurorName').textContent = d.juror?.name || '—';
        show('mainScreen');
        await loadAll();
      } else if (r.status === 403) {
        show('deniedScreen');
      } else {
        errEl.textContent = 'Sign-in failed. Please try again.';
      }
    } catch { errEl.textContent = 'No connection to the server.'; }
  }

  // ── data ──
  async function loadAll() {
    try {
      const pr = await fetch(API + '/api/results', { cache:'no-store' });
      const pd = await pr.json();
      // ordered by stage running order (draw number); no-number falls to the end
      participants = (pd.participants || []).slice().sort((a,b) =>
        (a.number ?? 999) - (b.number ?? 999) || a.id - b.id
      );
    } catch {}
    await refreshState();
    await refreshTotals();
    viewCat = panel.category;
    prevActive = panel.category;
    renderTabs();
    renderGrid();
  }
  // When the admin flips the active category, a juror sitting on the (now old)
  // active tab is moved to the new one. Someone just viewing the other tab stays.
  function syncActiveCat() {
    if (panel.category !== prevActive) {
      if (viewCat === prevActive) { viewCat = panel.category; renderGrid(); }
      prevActive = panel.category;
    }
    renderTabs();
  }
  async function refreshState() {
    const r = await fetch(API + '/api/jury/state', { headers: H(), cache:'no-store' });
    if (r.status === 401) return logout();
    const d = await r.json();
    panel.open = d.open; panel.category = d.category;
    myScores = { ethno: d.scores.ethno || {}, world: d.scores.world || {} };
  }
  let juryHidden = false;
  async function refreshTotals() {
    try {
      const r = await fetch(API + '/api/jury/results', { cache:'no-store' });
      const d = await r.json();
      // "protocol" mode (landing-only award list) reads as hidden here too —
      // jurors keep seeing their own picks, just not the running totals.
      juryHidden = d.reveal !== true;
      totals = { ethno: d.totals.ethno || {}, world: d.totals.world || {} };
      panel.open = d.open; panel.category = d.category;
    } catch { return; }
    document.getElementById('closedBanner').style.display = panel.open ? 'none' : 'block';
    syncActiveCat();
    participants.forEach(p => {
      const b = document.querySelector(`#tot-${p.id} b`);
      if (b) b.textContent = juryHidden ? '—' : (totals[viewCat][p.id]?.total ?? 0);
    });
  }
  async function setScore(pid, score) {
    if (!panel.open) { alert('Scoring is closed by the administrator.'); return; }
    if (viewCat !== panel.category) { alert('A different category is being scored now: ' + CAT_LABEL[panel.category] + '.'); return; }
    myScores[viewCat][pid] = score;
    paintCard(pid);
    const saved = document.querySelector(`#saved-${pid}`);
    try {
      const r = await fetch(API + '/api/jury/score', {
        method:'PUT', headers: H(),
        body: JSON.stringify({ participantId: pid, category: viewCat, score }),
      });
      if (r.status === 401) return logout();
      if (r.status === 403) {
        // admin changed state mid-tap — resync and stop
        await refreshState(); syncActiveCat(); renderGrid();
        if (saved) { saved.textContent = 'category locked'; saved.style.color = '#ffb84d'; }
        return;
      }
      if (!r.ok) { if (saved){saved.textContent='not saved'; saved.style.color='#ff6b6b';} return; }
      if (saved) { saved.textContent = 'saved ✓'; saved.style.color = '#51cf66'; }
      refreshTotals();
    } catch {
      if (saved) { saved.textContent = 'no connection'; saved.style.color = '#ff6b6b'; }
    }
  }

  // ── render ──
  function renderTabs() {
    const el = document.getElementById('catTabs');
    el.innerHTML = ['ethno','world'].map(c => {
      const isActive = c === panel.category;
      const mark = isActive ? '<span class="now" title="currently scored"></span>' : '<span class="lk">🔒</span>';
      return `<button class="tab${c===viewCat?' active':''}${isActive?'':' locked'}" data-cat="${c}">${CAT_LABEL[c]}${mark}</button>`;
    }).join('');
    el.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
      viewCat = b.dataset.cat; renderTabs(); renderGrid();
    }));
  }
  function paintCard(pid) {
    const wrap = document.querySelector(`#sc-${pid}`);
    if (!wrap) return;
    const mine = myScores[viewCat][pid];
    wrap.querySelectorAll('.sbtn').forEach((btn,i) => btn.classList.toggle('on', i+1 === mine));
  }
  function renderGrid() {
    const locked = viewCat !== panel.category;
    const note = document.getElementById('catNote');
    if (locked) {
      note.textContent = `Now scoring "${CAT_LABEL[panel.category]}". The "${CAT_LABEL[viewCat]}" category is locked — view only.`;
      note.style.display = 'block';
    } else {
      note.style.display = 'none';
    }

    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    participants.forEach(p => {
      const mine = myScores[viewCat][p.id];
      const tot = juryHidden ? '—' : (totals[viewCat][p.id]?.total ?? 0);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card__top">
          <div class="pnum" title="running order">${p.number ?? '—'}</div>
          <img class="card__photo" src="${PHOTO[p.slug]||NO_PHOTO}" alt="" onerror="this.onerror=null;this.src='${NO_PHOTO}'">
          <div class="card__id">
            <div class="card__name">${p.name}</div>
            <div class="card__country"><img src="./assets/media/flags/${p.code}.svg" alt="">${p.country||''}</div>
          </div>
          <div class="card__total" id="tot-${p.id}"><b>${tot}</b><span>total</span></div>
        </div>
        <div class="scores${locked ? ' locked' : ''}" id="sc-${p.id}">
          ${Array.from({length:10},(_,i)=>`<button class="sbtn${i+1===mine?' on':''}" data-s="${i+1}">${i+1}</button>`).join('')}
        </div>
        <div class="saved" id="saved-${p.id}"></div>
      `;
      if (!locked) {
        card.querySelectorAll('.sbtn').forEach(btn =>
          btn.addEventListener('click', () => setScore(p.id, Number(btn.dataset.s)))
        );
      }
      grid.appendChild(card);
    });
  }

  // ── boot ──
  window.addEventListener('DOMContentLoaded', () => {
    initGsi();
    if (token) {
      show('mainScreen');
      loadAll().catch(logout);
    } else {
      show('loginScreen');
    }
    setInterval(() => { if (token) refreshTotals(); }, 4000);
    setInterval(() => { if (token) refreshState().then(syncActiveCat); }, 15000);
  });
  </script>
</body>
</html>

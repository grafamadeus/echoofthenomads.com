# /etc/nginx/sites-available/api.echoofthenomads.com
# ln -s ../sites-available/... /etc/nginx/sites-enabled/ ; nginx -t ; systemctl reload nginx
# TLS lines are added automatically by: certbot --nginx -d api.echoofthenomads.com

# Cache zone for the polled results endpoint (put this in http{} — nginx.conf or conf.d).
proxy_cache_path /var/cache/nginx/echo_results levels=1:2 keys_zone=echo_results:5m
                 max_size=64m inactive=10s use_temp_path=off;

# Rate-limit zones (also in http{}).
limit_req_zone $binary_remote_addr zone=echo_vote:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=echo_api:10m  rate=600r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.echoofthenomads.com;

    # Only the API. No file serving here.
    location / { return 404; }

    location /api/ {
        limit_req zone=echo_api burst=60 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Absorb the polling: one upstream hit every ~2s no matter the crowd.
    location = /api/results {
        proxy_pass          http://127.0.0.1:3000;
        proxy_set_header    Host $host;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache         echo_results;
        # cache per Origin so the CORS header stays correct for apex + www
        proxy_cache_key     "$scheme$request_method$host$request_uri$http_origin";
        proxy_cache_valid   200 2s;
        proxy_cache_lock    on;
        proxy_cache_use_stale error timeout updating;
        add_header          X-Cache $upstream_cache_status;
    }

    location = /api/vote {
        limit_req zone=echo_vote burst=5 nodelay;
        proxy_pass        http://127.0.0.1:3000;
        proxy_set_header  Host $host;
        proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }

    # Admin: lock down hard. htpasswd -c /etc/nginx/echo-admin.htpasswd admin
    location /api/admin/ {
        auth_basic           "echo admin";
        auth_basic_user_file  /etc/nginx/echo-admin.htpasswd;
        proxy_pass            http://127.0.0.1:3000;
        proxy_set_header      Host $host;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

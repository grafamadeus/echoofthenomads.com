<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Winners — Echo of Nomads</title>
  <link rel="icon" href="./assets/media/favicon.ico" type="image/x-icon">
  <style>
    :root{ --navy-dark:#0a0f2c; --gold:#f0c040; --azure:#4db8ff; --white:#fff; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{background:var(--navy-dark);color:var(--white);
      font-family:'Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
      display:flex;align-items:center;justify-content:center}

    .bg{position:fixed;inset:0;z-index:0;
      background:url('./assets/media/background-01-01 (1).webp') no-repeat center/cover}
    .bg::before{content:'';position:absolute;inset:0;background:rgba(10,15,44,.82)}

    .podium{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;
      gap:clamp(20px,6vw,96px);padding:clamp(20px,4vw,64px)}

    .w{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(10px,1.8vh,22px)}
    .w--1{--c:var(--gold); --glow:rgba(240,192,64,.55)}
    .w--2,.w--3{--c:var(--azure); --glow:rgba(77,184,255,.5)}

    .pw{position:relative;display:grid;place-items:center}
    .w--1 .pw{width:clamp(190px,30vw,340px);height:clamp(190px,30vw,340px)}
    .w--2 .pw,.w--3 .pw{width:clamp(120px,20vw,220px);height:clamp(120px,20vw,220px)}

    .halo{position:absolute;inset:-16px;border-radius:50%;
      background:conic-gradient(from 0deg,transparent 0 55%,var(--c) 82%,transparent 100%);
      filter:blur(10px);opacity:.6;animation:spin 6s linear infinite}
    .particles{position:absolute;top:50%;left:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
      border-radius:50%;background:var(--c);animation:spin 17s linear infinite}
    .w--1 .particles{box-shadow:0 -120px 0 0 var(--c),104px -62px 0 -1px var(--c),118px 24px 0 -1px var(--c),
      58px 106px 0 0 var(--c),-50px 112px 0 -2px var(--c),-116px 32px 0 -1px var(--c),-94px -80px 0 -1px var(--c),20px -104px 0 -2px var(--c)}
    .w--2 .particles,.w--3 .particles{box-shadow:0 -78px 0 0 var(--c),68px -40px 0 -1px var(--c),76px 16px 0 -1px var(--c),
      38px 69px 0 0 var(--c),-32px 72px 0 -2px var(--c),-75px 22px 0 -1px var(--c),-61px -52px 0 -1px var(--c),13px -67px 0 -2px var(--c)}

    .ph{position:relative;z-index:1;width:86%;height:86%;border-radius:50%;object-fit:cover;background:#1a2540;
      border:3px solid var(--c);animation:pulse 3.2s ease-in-out infinite}

    .nm{font-weight:800;text-transform:uppercase;letter-spacing:.6px;line-height:1.15;
      font-size:clamp(14px,1.7vw,24px)}
    .w--1 .nm{font-size:clamp(17px,2.2vw,32px)}
    .place{font-family:'Oswald','Inter',sans-serif;font-weight:700;line-height:.85;color:var(--c);
      font-size:clamp(52px,9vw,130px);text-shadow:0 0 34px var(--glow)}
    .w--1 .place{font-size:clamp(72px,13vw,190px)}

    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(255,255,255,.04),0 0 22px 2px var(--glow)}
      50%{box-shadow:0 0 0 6px rgba(255,255,255,.04),0 0 48px 13px var(--glow)}}
    @media(prefers-reduced-motion:reduce){.halo,.particles,.ph{animation:none}}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="podium" id="podium">
    <div class="w w--2" data-rank="2"></div>
    <div class="w w--1" data-rank="1"></div>
    <div class="w w--3" data-rank="3"></div>
  </div>

  <script>
  const API = "https://api.echoofthenomads.com";
  const PHOTO = {
    "elif":"./assets/media/members/elif.webp","batista":"./assets/media/members/batista.webp",
    "villegas":"./assets/media/members/villegas.webp","roger-ricco":"./assets/media/members/Roger Ricco.webp",
    "angelov-vasil":"./assets/media/members/Angelov Vasil.webp","lva":"./assets/media/members/lva.webp",
    "vika":"./assets/media/members/vika.webp","hodaya":"./assets/media/members/hodaya.webp",
    "buga":"./assets/media/members/buga.webp","naumenko":"./assets/media/members/naumenko.webp",
    "hasanic":"./assets/media/members/hasanic.webp","leal":"./assets/media/members/leal.webp",
    "thami":"./assets/media/members/thami.webp","odmandakh":"./assets/media/members/odmandakh.jpeg",
    "ngo-chau":"./assets/media/members/ngo chau.webp","zhasmin":"./assets/media/members/zhasmin.webp",
    "danial":"./assets/media/members/danial.webp","lee":"./assets/media/members/lee.webp",
    "derkembaev":"./assets/media/members/derkembaev.webp","starbekov":"./assets/media/members/starbekov.webp"
  };
  const NO_PHOTO = "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 56 56%22%3E%3Crect width=%2256%22 height=%2256%22 fill=%22%231a2540%22/%3E%3Ccircle cx=%2228%22 cy=%2223%22 r=%2210%22 fill=%22%23f0c040%22/%3E%3Cpath d=%22M9 52c1-11 9-17 19-17s18 6 19 17z%22 fill=%22%23f0c040%22/%3E%3C/svg%3E";
  const img = s => PHOTO[s] || NO_PHOTO;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function tick(){
    try{
      const d = await fetch(API + '/api/results', { cache:'no-store' }).then(r => r.json());
      const top = (d.participants || []).slice()
        .sort((a,b) => (b.votes - a.votes) || (a.id - b.id))
        .slice(0, 3);
      [1,2,3].forEach(rank => {
        const el = document.querySelector('.w[data-rank="' + rank + '"]');
        const p = top[rank - 1];
        el.innerHTML = p ? (
          '<div class="pw">' +
            '<span class="halo"></span><span class="particles"></span>' +
            '<img class="ph" src="' + img(p.slug) + '" onerror="this.onerror=null;this.src=\'' + NO_PHOTO + '\'" alt="">' +
          '</div>' +
          '<div class="nm">' + esc(p.name) + '</div>' +
          '<div class="place">' + rank + '</div>'
        ) : '';
      });
    }catch(e){}
  }
  tick();
  setInterval(tick, 5000);
  </script>
</body>
</html>

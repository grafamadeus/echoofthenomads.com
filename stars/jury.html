<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жюри — Улуттук тандоо 2026</title>
  <style>
    :root {
      --navy-dark: #0a0f2c;
      --navy: #1a3a8f;
      --gold: #f5c400;
      --gold-dark: #f0c040;
      --white: #ffffff;
      --text-muted: #888;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    html, body {
      min-height: 100%;
      background: var(--navy-dark);
      color: var(--white);
      font-family: 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── WAVES TOP ── */
    .waves-top {
      position: relative;
      height: 100px;
      overflow: hidden;
      transform: scaleY(-1);
      background: var(--navy-dark);
    }
    .waves-top .air {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 80px;
      background: url(https://1.bp.blogspot.com/-xQUc-TovqDk/XdxogmMqIRI/AAAAAAAACvI/AizpnE509UMGBcTiLJ58BC6iViPYGYQfQCLcBGAsYHQ/s1600/wave.png);
      background-size: 1000px 80px;
    }
    .waves-top .air1 { animation: wave 30s linear infinite; opacity: 1; }
    .waves-top .air2 { animation: wave2 15s linear infinite; opacity: 0.5; animation-delay: -5s; bottom: 8px; }

    /* ── WAVES BOTTOM ── */
    .waves-bottom {
      position: relative;
      height: 100px;
      overflow: hidden;
      background: var(--navy-dark);
    }
    .waves-bottom .air {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 80px;
      background: url(https://1.bp.blogspot.com/-xQUc-TovqDk/XdxogmMqIRI/AAAAAAAACvI/AizpnE509UMGBcTiLJ58BC6iViPYGYQfQCLcBGAsYHQ/s1600/wave.png);
      background-size: 1000px 80px;
    }
    .waves-bottom .air1 { animation: wave 30s linear infinite; opacity: 1; }
    .waves-bottom .air2 { animation: wave2 15s linear infinite; opacity: 0.5; animation-delay: -5s; bottom: 8px; }

    @keyframes wave  { 0% { background-position-x: 0px; } 100% { background-position-x: 1000px; } }
    @keyframes wave2 { 0% { background-position-x: 0px; } 100% { background-position-x: -1000px; } }

    /* ── PIN SCREEN ── */
    #pinScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .pin-box {
      background: linear-gradient(160deg, #16213e, #0f3460);
      border: 1px solid rgba(240,192,64,0.3);
      border-radius: 20px;
      padding: 40px 28px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .pin-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .pin-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 6px;
    }
    .pin-desc {
      font-size: 0.82rem;
      color: #aaa;
      margin-bottom: 24px;
    }
    .pin-input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(240,192,64,0.3);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--white);
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      margin-bottom: 12px;
    }
    .pin-input:focus { border-color: var(--gold); }
    .pin-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e8c547, #f0c040, #c9a227);
      color: #000;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 10px;
      transition: opacity 0.2s;
    }
    .pin-btn:hover { opacity: 0.9; }
    .pin-error {
      color: #ff6b6b;
      font-size: 0.8rem;
      margin-top: 8px;
      min-height: 18px;
    }

    /* ── MAIN SCREEN ── */
    #mainScreen { display: none; }

    .jury-header {
      background: rgba(240,192,64,0.08);
      border-bottom: 1px solid rgba(240,192,64,0.2);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .jury-header__title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .jury-header__user {
      font-size: 0.75rem;
      color: #aaa;
    }

    .jury-content {
      width: 80%;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .jury-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .jury-subtitle {
      text-align: center;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 24px;
    }

    /* ── MEMBER CARDS ── */
    .jury-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .jury-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(240,192,64,0.15);
      border-radius: 14px;
      padding: 14px;
      transition: border-color 0.2s;
    }
    .jury-card.voted {
      border-color: rgba(240,192,64,0.5);
      background: rgba(240,192,64,0.05);
    }

    .jury-card__top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .jury-card__photo {
      width: 56px; height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(240,192,64,0.4);
      flex-shrink: 0;
    }
    .jury-card__name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--white);
      flex: 1;
    }
    .jury-card__score-display {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--gold);
      min-width: 32px;
      text-align: center;
    }

    /* Score buttons */
    .score-btns {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .score-btn {
      padding: 30px 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(240,192,64,0.2);
      border-radius: 8px;
      color: #aaa;
      font-size: 0.9rem;
      font-weight: 700;
      transition: all 0.15s;
    }
    .score-btn:hover {
      background: rgba(240,192,64,0.15);
      color: var(--gold);
      border-color: rgba(240,192,64,0.4);
    }
    .score-btn.selected {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    .jury-card__submit {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #e8c547, #f0c040, #c9a227);
      color: #000;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    .jury-card__submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .jury-card__submit:hover:not(:disabled) { opacity: 0.9; }

    .jury-card__voted-badge {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #51cf66;
      font-weight: 600;
    }
    .jury-card.voted .jury-card__voted-badge { display: flex; }
    .jury-card.voted .jury-card__submit { display: none; }
    .jury-card.voted .score-btn { pointer-events: none; }

    .jury-total-score {
    font-size: 0.8rem;
    color: #aaa;
    margin-bottom: 10px;
    }
    .jury-total-score span {
    color: var(--gold);
    font-weight: 700;
    font-size: 1rem;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: linear-gradient(160deg, #16213e, #0f3460);
      border: 1px solid rgba(240,192,64,0.3);
      border-radius: 20px;
      padding: 40px 28px;
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .login-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .login-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
    .login-desc { font-size: 0.82rem; color: #aaa; margin-bottom: 24px; }
    .login-error { color: #ff6b6b; font-size: 0.8rem; margin-top: 8px; min-height: 18px; }

    .google-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 16px;
      background: #fff;
      color: #333;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 10px;
      transition: opacity 0.2s;
    }
    .google-btn:hover { opacity: 0.9; }

    /* ── ACCESS DENIED ── */
    #deniedScreen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .denied-box {
      max-width: 340px;
    }
    .denied-icon { font-size: 3rem; margin-bottom: 16px; }
    .denied-title { font-size: 1.2rem; font-weight: 700; color: #ff6b6b; margin-bottom: 8px; }
    .denied-desc { color: #aaa; font-size: 0.85rem; }

    
  </style>
</head>
<body>

  <!-- PIN SCREEN -->
  <div id="pinScreen">
    <div class="pin-box">
      <div class="pin-icon">🔐</div>
      <h2 class="pin-title">Жюри панели</h2>
      <p class="pin-desc">Кирүү үчүн PIN кодду жазыңыз</p>
      <input type="password" class="pin-input" id="pinInput" placeholder="···" maxlength="10" inputmode="numeric">
      <button class="pin-btn" onclick="checkPin()">Кирүү</button>
      <div class="pin-error" id="pinError"></div>
    </div>
  </div>

  <!-- LOGIN SCREEN (Google) -->
  <div id="loginScreen" style="display:none;">
    <div class="login-box">
      <div class="login-icon">🎵</div>
      <h2 class="login-title">Жюри аккаунту</h2>
      <p class="login-desc">Жюри Google аккаунту менен кириңиз</p>
      <button class="google-btn" onclick="signInGoogle()">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google менен кирүү
      </button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- ACCESS DENIED -->
  <div id="deniedScreen">
    <div class="denied-box">
      <div class="denied-icon">🚫</div>
      <h2 class="denied-title">Уруксат жок</h2>
      <p class="denied-desc">Бул барак жюри мүчөлөрү үчүн гана.</p>
      <button class="pin-btn" style="margin-top:20px;" onclick="signOutJury()">Чыгуу</button>
    </div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="mainScreen">
    <div class="waves-top">
      <div class="air air1"></div>
      <div class="air air2"></div>
    </div>
    <div class="jury-content">
    <div class="jury-header__user" id="juryUserEmail"></div>
      <h2 class="jury-title">Катышуучулар</h2>
      <p class="jury-subtitle">Ар бир катышуучуга 1ден 10го чейин балл коюңуз</p>
      <div class="jury-grid" id="juryGrid"></div>
    </div>

    <div class="waves-bottom">
      <div class="air air1"></div>
      <div class="air air2"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp }     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut }
                                 from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot }
                                 from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBLA3dWcxxvNrXlfMtVOwWC1n3cUHORils",
      authDomain: "national-selection.firebaseapp.com",
      projectId: "national-selection",
      storageBucket: "national-selection.firebasestorage.app",
      messagingSenderId: "753183678536",
      appId: "1:753183678536:web:cbab2779087c0b8e73f87d"
    };

    const JURY_EMAILS = [
      "jury1.wng@gmail.com",
      "jury2.wng@gmail.com",
      "echonomad25@gmail.com"
    ];

    const PARTICIPANTS = [
      { name: "Жанар Туратова",        photo: "./assets/media/members/1.webp" },
      { name: "Талант Токомбаев",         photo: "./assets/media/members/2.webp" },
      { name: "Данияр Дөөлөтбаков",     photo: "./assets/media/members/3.webp" },
      { name: "Райкан Абдувалиева",   photo: "./assets/media/members/4.webp" },
      { name: "Мистер Оскар",             photo: "./assets/media/members/5.webp" },
      { name: "Бактыгүл Абди Жетиген",      photo: "./assets/media/members/6.webp" },
      { name: "Тэсан Ко Асанакун",      photo: "./assets/media/members/7.webp" },
      { name: "Талайбекова Адинай", photo: "./assets/media/members/8.webp" },
      { name: "Актилек Муратова",     photo: "./assets/media/members/9.webp" },
      { name: "Ырыскелди Осмонкулов",     photo: "./assets/media/members/10.webp" },
      { name: "Айбек Саралаев",     photo: "./assets/media/members/11.webp" },
      { name: "Бегимай Турусбекова",     photo: "./assets/media/members/12.webp" },
      { name: "Першина Аяна",     photo: "./assets/media/members/13.webp" },
      { name: "Тилек Найманбаев",     photo: "./assets/media/members/14.webp" },
    ];

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    let currentUser = null;
    let selectedScores = {};
    let submittedScores = {};
    let totalScores = {}; // ← НОВОЕ: суммарные баллы всех жюри

    // ── PIN проверка ──
    window.checkPin = async () => {
      const pin = document.getElementById('pinInput').value.trim();
      const errEl = document.getElementById('pinError');
      errEl.textContent = '';
      try {
        const pinDoc = await getDoc(doc(db, 'settings', 'jury'));
        if (!pinDoc.exists()) {
          errEl.textContent = 'PIN не настроен. Обратитесь к администратору.';
          return;
        }
        if (pin === String(pinDoc.data().pin)) {
          document.getElementById('pinScreen').style.display = 'none';
          document.getElementById('loginScreen').style.display = 'flex';
        } else {
          errEl.textContent = 'Неверный PIN. Попробуйте снова.';
          document.getElementById('pinInput').value = '';
        }
      } catch(e) {
        errEl.textContent = 'Ошибка. Попробуйте снова.';
        console.error(e);
      }
    };

    document.getElementById('pinInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.checkPin();
    });

    // ── Google вход ──
    window.signInGoogle = async () => {
      const errEl = document.getElementById('loginError');
      errEl.textContent = '';
      try {
        const result = await signInWithPopup(auth, new GoogleAuthProvider());
        const email = result.user.email;
        if (!JURY_EMAILS.includes(email)) {
          await signOut(auth);
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('deniedScreen').style.display = 'flex';
          return;
        }
        currentUser = result.user;
        document.getElementById('loginScreen').style.display = 'none';
        initJuryPanel();
      } catch(e) {
        if (e.code !== 'auth/popup-closed-by-user')
          errEl.textContent = 'Ошибка входа. Попробуйте снова.';
      }
    };

    window.signOutJury = async () => {
      await signOut(auth);
      location.reload();
    };

    // ── Инициализация панели ──
    async function initJuryPanel() {
      document.getElementById('mainScreen').style.display = 'block';
      document.getElementById('juryUserEmail').textContent = currentUser.email;

      const juryId = currentUser.uid;
      const existingDoc = await getDoc(doc(db, 'jury_votes_stars', juryId));
      if (existingDoc.exists()) {
        submittedScores = existingDoc.data().scores || {};
      }

      renderJuryGrid();

      // ← НОВОЕ: слушаем все баллы жюри в реальном времени
      onSnapshot(collection(db, 'jury_votes'), (snapshot) => {
        totalScores = {};
        snapshot.forEach(docSnap => {
          const scores = docSnap.data().scores || {};
          Object.entries(scores).forEach(([name, score]) => {
            totalScores[name] = (totalScores[name] || 0) + score;
          });
        });
        // Обновляем только цифры без перерисовки карточек
        PARTICIPANTS.forEach((p, idx) => {
          const el = document.getElementById(`total-score-${idx}`);
          if (el) el.textContent = totalScores[p.name] || 0;
        });
      });
    }

    // ── Рендер карточек ──
    function renderJuryGrid() {
      const grid = document.getElementById('juryGrid');
      grid.innerHTML = '';

      PARTICIPANTS.forEach((p, idx) => {
        const alreadyVoted = submittedScores[p.name] !== undefined;
        const currentScore = selectedScores[p.name] || submittedScores[p.name] || 0;

        const card = document.createElement('div');
        card.className = `jury-card${alreadyVoted ? ' voted' : ''}`;
        card.id = `card-${idx}`;

        let scoreBtns = '';
        for (let i = 1; i <= 10; i++) {
          scoreBtns += `<button class="score-btn${currentScore === i ? ' selected' : ''}" 
            onclick="selectScore(${idx}, '${p.name}', ${i})">${i}</button>`;
        }

        card.innerHTML = `
          <div class="jury-card__top">
            <img class="jury-card__photo" src="${p.photo}" alt="${p.name}">
            <div class="jury-card__name">${p.name}</div>
            <div class="jury-card__score-display" id="total-score-${idx}">
            ${totalScores[p.name] || '—'}
            </div>
          </div>
          <div class="score-btns">${scoreBtns}</div>
          <div class="jury-card__voted-badge">✅ Балл берилди: <strong>${submittedScores[p.name] || ''}</strong></div>
          <button class="jury-card__submit" id="submit-${idx}" 
            ${!selectedScores[p.name] ? 'disabled' : ''}
            onclick="submitScore('${p.name}', ${idx})">
            Баллды жөнөтүү
          </button>
        `;

        grid.appendChild(card);
      });
    }

    // ── Выбор балла ──
    window.selectScore = (idx, name, score) => {
      const card = document.getElementById(`card-${idx}`);
      if (card.classList.contains('voted')) return;
      selectedScores[name] = score;
      card.querySelectorAll('.score-btn').forEach((btn, i) => {
        btn.classList.toggle('selected', i + 1 === score);
      });
      document.getElementById(`submit-${idx}`).disabled = false;
    };

    // ── Отправка балла ──
    window.submitScore = async (name, idx) => {
      const score = selectedScores[name];
      if (!score) return;
      const submitBtn = document.getElementById(`submit-${idx}`);
      submitBtn.disabled = true;
      submitBtn.textContent = 'Жөнөтүлүүдө...';
      try {
        const juryId = currentUser.uid;
        submittedScores[name] = score;
        await setDoc(doc(db, 'jury_votes_stars', juryId), {
          email: currentUser.email,
          scores: submittedScores,
          lastVoted: name,
          updatedAt: new Date().toISOString()
        });
        const card = document.getElementById(`card-${idx}`);
        card.classList.add('voted');
        card.querySelector('.jury-card__voted-badge strong').textContent = score;
        card.querySelector('.jury-card__voted-badge').style.display = 'flex';
        submitBtn.style.display = 'none';
      } catch(e) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Баллды жөнөтүү';
        alert('Ката чыкты. Кайра аракет кылыңыз.');
        console.error(e);
      }
    };
  </script>
</body>
</html>
